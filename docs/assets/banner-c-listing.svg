<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Doomsday.asm - the opening lines of the 8086 source">
  <title>Doomsday in 8086 Assembly</title>

  <defs>
    <!-- The listing fades in from the left so the title never fights it. -->
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.34" stop-color="#000000"/>
      <stop offset="0.54" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="listingMask">
      <rect width="1200" height="360" fill="url(#fade)"/>
    </mask>
    <pattern id="scanC" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.015"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="#07070c"/>

  <!-- Real lines, in file order, from docs/asm/doomsday.asm. Not sample code. -->
  <g mask="url(#listingMask)"
     font-family="Consolas, 'DejaVu Sans Mono', Menlo, ui-monospace, monospace" font-size="15.5">
    <g fill="#3d3d49" text-anchor="end">
      <text x="516" y="48">1</text>
      <text x="516" y="69">2</text>
      <text x="516" y="90">3</text>
      <text x="516" y="111">4</text>
      <text x="516" y="132">5</text>
      <text x="516" y="153">6</text>
      <text x="516" y="174">7</text>
      <text x="516" y="195">8</text>
      <text x="516" y="216">9</text>
      <text x="516" y="237">10</text>
      <text x="516" y="258">11</text>
      <text x="516" y="279">12</text>
      <text x="516" y="300">13</text>
      <text x="516" y="321">14</text>
    </g>
    <g fill="#d4d4d4">
      <text x="548" y="48">[<tspan fill="#c586c0">org</tspan> <tspan fill="#b5cea8">0x100</tspan>]</text>
      <text x="548" y="90"><tspan fill="#569cd6">mov</tspan> <tspan fill="#9cdcfe">ah</tspan>,<tspan fill="#b5cea8">0x09</tspan></text>
      <text x="548" y="111"><tspan fill="#569cd6">mov</tspan> <tspan fill="#9cdcfe">dx</tspan>,msg1</text>
      <text x="548" y="132"><tspan fill="#569cd6">int</tspan> <tspan fill="#b5cea8">0x21</tspan></text>
      <text x="548" y="174"><tspan fill="#569cd6">mov</tspan> <tspan fill="#9cdcfe">dx</tspan>,msg2</text>
      <text x="548" y="195"><tspan fill="#569cd6">int</tspan> <tspan fill="#b5cea8">0x21</tspan></text>
      <text x="548" y="237"><tspan fill="#569cd6">mov</tspan> <tspan fill="#9cdcfe">ah</tspan>,<tspan fill="#b5cea8">0x01</tspan></text>
      <text x="548" y="258"><tspan fill="#569cd6">int</tspan> <tspan fill="#b5cea8">0x21</tspan></text>
      <text x="548" y="279"><tspan fill="#569cd6">sub</tspan> <tspan fill="#9cdcfe">al</tspan>,<tspan fill="#ce9178">&#39;0&#39;</tspan></text>
      <text x="548" y="321"><tspan fill="#569cd6">mov</tspan> [<tspan fill="#dcdcaa">year</tspan>],<tspan fill="#9cdcfe">al</tspan></text>
    </g>
  </g>

  <rect width="1200" height="360" fill="url(#scanC)"/>
  <rect x="0" y="0" width="1200" height="2" fill="#55ffff"/>

  <g font-family="Consolas, 'DejaVu Sans Mono', Menlo, ui-monospace, monospace">
    <text x="64" y="118" font-size="12.5" letter-spacing="4" fill="#55555f">480 LINES &#183; NO LIBRARIES</text>

    <text x="64" y="174" font-size="60" font-weight="700" letter-spacing="-1.6" fill="#ffffff">DOOMSDAY<tspan fill="#55ffff">.asm</tspan></text>

    <rect x="64" y="195" width="58" height="3" fill="#ffff55"/>

    <text x="64" y="250" font-size="17" fill="#b6b6c2">Conway&#8217;s weekday algorithm, written by</text>
    <text x="64" y="258" font-size="17" fill="#b6b6c2">hand in 8086 assembly. NASM and DOSBox</text>
    <text x="64" y="302" font-size="17" fill="#7c7c8a">run it live in your browser.</text>
  </g>
</svg>
